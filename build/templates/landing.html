<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<meta name="description" content="Status masa nyata Jabatan Kecemasan dan Pusat Penilaian Pesakit, Hospital Tengku Permaisuri Norashikin, Kajang."/>
<title>Status Jabatan Kecemasan &amp; PAC — HTPN Kajang</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
{{TOKENS}}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html { -webkit-text-size-adjust: 100% }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--page); color: var(--ink);
  line-height: 1.5; min-height: 100vh;
}
.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto }
a { color: inherit }

/* ── Header ─────────────────────────────────────────────── */
.top {
  background: linear-gradient(135deg, var(--brand-dk), var(--brand));
  color: #fff; padding: 14px 0;
  position: sticky; top: 0; z-index: 20;
  box-shadow: 0 2px 14px rgba(5, 82, 87, .22);
}
.top .wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap }
.top h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2 }
.top p { font-size: 12.5px; opacity: .85; font-weight: 600 }
.top-id { flex: 1; min-width: 0 }
.btn-ghost {
  border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12);
  color: #fff; font: inherit; font-size: 13px; font-weight: 700;
  border-radius: 999px; padding: 8px 15px; cursor: pointer;
  min-height: 40px; display: inline-flex; align-items: center; gap: 7px;
}
.btn-ghost:hover { background: rgba(255,255,255,.22) }
.btn-ghost:focus-visible { outline: 3px solid #fff; outline-offset: 2px }

/* ── Hero ───────────────────────────────────────────────── */
.hero { padding: 40px 0 26px; text-align: center }
.kicker {
  display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: var(--brand-dk);
  background: var(--brand-lt); border-radius: 999px; padding: 6px 14px;
}
.hero h2 {
  font-size: clamp(28px, 5.4vw, 44px); font-weight: 800; line-height: 1.1;
  letter-spacing: -.025em; margin: 14px 0 10px;
}
.hero .lead {
  font-size: clamp(15px, 2.2vw, 18px); color: var(--ink-2); font-weight: 600;
  max-width: 54ch; margin-inline: auto;
}
.stamp {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 9px;
  font-size: 13px; font-weight: 700; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 15px; box-shadow: var(--shadow);
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none }
.is-stale .dot { background: var(--warn) }
.chip-demo {
  margin-left: 6px; font-size: 11px; font-weight: 800; letter-spacing: .06em;
  color: var(--accent); background: #fff5e8; border: 1px solid #f2d9b6;
  border-radius: 999px; padding: 3px 9px;
}

/* ── Section furniture ──────────────────────────────────── */
section { padding: 18px 0 }
.sec-hd { margin-bottom: 14px }
.sec-hd h3 {
  font-size: clamp(19px, 3vw, 24px); font-weight: 800; letter-spacing: -.015em;
}
.sec-hd p { font-size: 14px; color: var(--ink-2); font-weight: 600; margin-top: 3px }

/* ── Unit cards ─────────────────────────────────────────── */
.units { display: grid; gap: 14px; grid-template-columns: 1fr }
@media (min-width: 720px)  { .units { grid-template-columns: repeat(2, 1fr) } }
@media (min-width: 1020px) { .units { grid-template-columns: repeat(3, 1fr) } }

.unit {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
  text-decoration: none; color: inherit;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.unit:hover { transform: translateY(-2px); border-color: var(--brand); box-shadow: 0 6px 22px rgba(20,32,42,.1) }
.unit:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px }
/* Name first, state beneath. Side by side, a long crisis badge squeezed
   "Kecemasan — Wanita & Kanak-Kanak" onto three lines. */
.unit-hd { display: flex; flex-direction: column; align-items: flex-start; gap: 9px }
.unit-name { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; line-height: 1.22 }
.unit-sub { font-size: 12.5px; color: var(--ink-3); font-weight: 700; margin-top: 2px }

.state {
  flex: none; font-size: 11.5px; font-weight: 800; border-radius: 999px;
  padding: 5px 11px; display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap;
}
.state.is-ok     { background: #e7f6e9; color: #14691a }
.state.is-busy   { background: #fff4e0; color: #8a4b00 }
.state.is-full   { background: #fde9e9; color: #9b1c1c }
.state.is-crisis { background: var(--critical); color: #fff }

.unit-nums { display: flex; align-items: baseline; gap: 10px }
.unit-big {
  font-size: 46px; font-weight: 800; line-height: .95; letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
}
.unit-cap { font-size: 13px; font-weight: 700; color: var(--ink-2); line-height: 1.25 }

/* One strip per zone, in escalation order. Width is the share of the unit's
   patients, so the strip reads as composition; the label beneath carries the
   identity, because two of these hues sit under 3:1 on white. */
.zstrip { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; background: #eef2f5 }
.zstrip i { display: block; height: 100% }
.zkeys { display: flex; flex-wrap: wrap; gap: 4px 12px }
.zkey { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--ink-2) }
.zkey b { font-variant-numeric: tabular-nums; color: var(--ink) }
.zkey .sw { width: 9px; height: 9px; border-radius: 2px; flex: none }
.z-rz{background:var(--zone-rz)} .z-yz{background:var(--zone-yz)} .z-gz{background:var(--zone-gz)}
.z-ob{background:var(--zone-ob)} .z-ab{background:var(--zone-ab)} .z-pac{background:var(--zone-pac)}

.unit-wait {
  border-top: 1px dashed var(--line); padding-top: 10px;
  display: flex; align-items: baseline; gap: 8px;
}
.unit-wait b { font-size: 24px; font-weight: 800; color: var(--zone-gz); font-variant-numeric: tabular-nums }
.unit-wait span { font-size: 12.5px; font-weight: 700; color: var(--ink-2) }
.unit-go {
  margin-top: auto; font-size: 14px; font-weight: 800; color: var(--brand-dk);
  display: inline-flex; align-items: center; gap: 6px;
}

.skel { color: var(--ink-3); font-weight: 700 }
.offline {
  background: #fff5e8; border: 1px solid #f2d9b6; color: #7a4a00;
  border-radius: 12px; padding: 14px 16px; font-size: 14px; font-weight: 700;
}

/* ── Notices ────────────────────────────────────────────── */
.notices { display: grid; gap: 14px; grid-template-columns: 1fr }
@media (min-width: 860px) { .notices { grid-template-columns: 1.1fr 1fr } }
.note {
  border-radius: 14px; padding: 18px; display: flex; gap: 14px;
  box-shadow: var(--shadow);
}
.note-ic { font-size: 28px; line-height: 1.1; flex: none }
.note h4 { font-size: 17px; font-weight: 800; line-height: 1.25; margin-bottom: 6px }
.note p { font-size: 14px; font-weight: 600; line-height: 1.45 }
.note p + p { margin-top: 7px }
.note.is-klinik { background: #fffaf0; border: 1px solid #f0dcb8 }
.note.is-klinik h4 { color: #8a4b00 }
.note.is-klinik p { color: #5c4421 }
.note.is-counter { background: linear-gradient(135deg, var(--brand-dk), var(--brand)); color: #fff }
.note.is-counter p { opacity: .93 }

/* ── Peranan Rakyat ─────────────────────────────────────── */
.roles { display: grid; gap: 14px; grid-template-columns: 1fr }
@media (min-width: 680px)  { .roles { grid-template-columns: repeat(2, 1fr) } }
@media (min-width: 1020px) { .roles { grid-template-columns: repeat(3, 1fr) } }
.role {
  background: var(--surface); border: 1px solid var(--line);
  border-top: 5px solid var(--role-tone, var(--brand));
  border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 9px;
}
.role.t-move  { --role-tone: #2a78d6 }
.role.t-sugar { --role-tone: #4a3aa7 }
.role.t-meds  { --role-tone: #8a3fa8 }
.role.t-smoke { --role-tone: #4a5763 }
.role.t-use   { --role-tone: var(--brand-dk) }
.role-top { display: flex; align-items: center; gap: 9px }
.role-ic { font-size: 24px; line-height: 1 }
.role-no {
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--role-tone); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
}
.role h4 { font-size: 18px; font-weight: 800; line-height: 1.2 }
.role .role-lead { font-size: 14px; font-weight: 700; color: var(--ink-2); line-height: 1.4 }
.role ul { list-style: none; display: flex; flex-direction: column; gap: 6px }
.role li { position: relative; padding-left: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.4 }
.role li::before {
  content: ''; position: absolute; left: 0; top: 8px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--role-tone);
}
.role-act {
  margin-top: auto; background: var(--surface-2);
  border-left: 3px solid var(--role-tone); border-radius: 6px;
  padding: 10px 12px; font-size: 13.5px; font-weight: 700; line-height: 1.38;
}
.role-src { font-size: 11px; font-weight: 600; color: var(--ink-3); line-height: 1.3 }

/* ── Tools ──────────────────────────────────────────────── */
.tools { display: grid; gap: 14px; grid-template-columns: 1fr }
@media (min-width: 720px) { .tools { grid-template-columns: repeat(2, 1fr) } }
.tool {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; box-shadow: var(--shadow); display: flex; gap: 14px;
  text-decoration: none; color: inherit;
}
.tool:hover { border-color: var(--brand) }
.tool:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px }
.tool h4 { font-size: 16px; font-weight: 800; margin-bottom: 4px }
.tool p { font-size: 13.5px; color: var(--ink-2); font-weight: 600; line-height: 1.4 }
.tool-go { margin-top: 7px; font-size: 13.5px; font-weight: 800; color: var(--brand-dk) }

/* ── Footer ─────────────────────────────────────────────── */
.foot {
  margin-top: 26px; padding: 22px 0 34px;
  border-top: 1px solid var(--line); color: var(--ink-3);
  font-size: 12.5px; font-weight: 600; text-align: center;
}
.foot p + p { margin-top: 5px }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-id">
      <h1 data-k="appTitle">Jabatan Kecemasan &amp; PAC</h1>
      <p data-k="appSub">Hospital Tengku Permaisuri Norashikin, Kajang</p>
    </div>
    <button class="btn-ghost" id="langBtn" type="button">
      <span id="langFlag">🇬🇧</span><span id="langLabel">English</span>
    </button>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="hero">
      <span class="kicker" data-k="landing.kicker">Perkhidmatan Awam</span>
      <h2 data-k="landing.title">Status Jabatan Kecemasan &amp; PAC</h2>
      <p class="lead" data-k="landing.lead"></p>
      <div class="stamp" id="stamp">
        <span class="dot" aria-hidden="true"></span>
        <span id="stampLabel" data-k="loading">Memuatkan…</span>
        <span class="mono" id="stampTime"></span>
        <span class="chip-demo" id="demoChip" data-k="demoTag">DEMO</span>
      </div>
    </div>

    <section aria-labelledby="unitsHd">
      <div class="sec-hd">
        <h3 id="unitsHd" data-k="landing.liveNow">Keadaan sekarang</h3>
        <p data-k="landing.unitsSub"></p>
      </div>
      <div class="units" id="units"></div>
    </section>

    <section aria-label="notices">
      <div class="notices">
        <div class="note is-klinik">
          <span class="note-ic" aria-hidden="true">🏥</span>
          <div>
            <h4 data-k="public.klinikTitle"></h4>
            <p data-k="public.klinikBody"></p>
            <p data-k="public.klinikMadani"></p>
          </div>
        </div>
        <div class="note is-counter">
          <span class="note-ic" aria-hidden="true">👩‍⚕️</span>
          <div>
            <h4 data-k="public.counterTitle"></h4>
            <p data-k="public.counterSub"></p>
          </div>
        </div>
      </div>
    </section>

    <section aria-labelledby="rolesHd">
      <div class="sec-hd">
        <h3 id="rolesHd" data-k="landing.perananTitle"></h3>
        <p data-k="landing.perananLead"></p>
      </div>
      <div class="roles" id="roles">{{PERANAN}}</div>
    </section>

    <section aria-label="tools">
      <div class="tools">
        <a class="tool" href="/tv">
          <span class="note-ic" aria-hidden="true">📺</span>
          <div>
            <h4 data-k="landing.tvTitle"></h4>
            <p data-k="landing.tvBody"></p>
            <div class="tool-go" data-k="landing.tvLink"></div>
          </div>
        </a>
        <a class="tool" href="/poster">
          <span class="note-ic" aria-hidden="true">🖨️</span>
          <div>
            <h4 data-k="landing.posterTitle"></h4>
            <p data-k="landing.posterBody"></p>
            <div class="tool-go" data-k="landing.posterLink"></div>
          </div>
        </a>
      </div>
    </section>

    <footer class="foot">
      <p data-k="footer"></p>
      <p data-k="credit"></p>
    </footer>

  </div>
</main>

<script>
{{I18N}}
</script>
<script>
(function () {
  'use strict';

  var ORDER = ['rz', 'yz', 'ob', 'ab', 'pac', 'gz'];
  var UNITS = ['wcc', 'bu', 'pac'];
  var REFRESH_MS = 15 * 60 * 1000;

  var lang = 'ms';
  try { var sv = localStorage.getItem('edpac_lang'); if (sv === 'ms' || sv === 'en') lang = sv; } catch (e) {}

  function dict() { return I18N[lang] || I18N.ms; }
  function t(path) {
    var parts = String(path).split('.'), o = dict();
    for (var i = 0; i < parts.length && o != null; i++) o = o[parts[i]];
    if (o == null) {
      o = I18N.ms;
      for (var j = 0; j < parts.length && o != null; j++) o = o[parts[j]];
    }
    return o == null ? '' : o;
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function $(id) { return document.getElementById(id); }

  function applyStrings() {
    document.documentElement.lang = lang;
    var nodes = document.querySelectorAll('[data-k]');
    for (var i = 0; i < nodes.length; i++) {
      var v = t(nodes[i].getAttribute('data-k'));
      if (typeof v === 'string' && v) nodes[i].textContent = v;
    }
    $('langFlag').textContent = t('langFlag');
    $('langLabel').textContent = t('langLabel');
    // Role cards hold both languages; only one is shown.
    var roles = document.querySelectorAll('#roles [data-lang]');
    for (var j = 0; j < roles.length; j++) {
      roles[j].hidden = roles[j].getAttribute('data-lang') !== lang;
    }
  }

  $('langBtn').onclick = function () {
    lang = lang === 'ms' ? 'en' : 'ms';
    try { localStorage.setItem('edpac_lang', lang); } catch (e) {}
    applyStrings();
    if (lastData) paint(lastData);
  };

  /* Same arithmetic as the status board, deliberately: a landing page that
     disagrees with the board it links to is worse than no landing page. */
  function unitFigures(d) {
    var zones = (d.occupancy || []).filter(function (z) { return z.capacity > 0; })
      .sort(function (a, b) { return ORDER.indexOf(a.zone) - ORDER.indexOf(b.zone); });
    var patients = 0, capacity = 0, over = 0, waiting = 0;
    var parts = zones.map(function (z) {
      var total = z.funded + z.crisis;
      patients += total; capacity += z.capacity;
      over += Math.max(0, total - z.capacity);
      if (z.isRoomZone) waiting += (z.waiting || 0);
      return { zone: z.zone, total: total };
    });
    var pct = capacity > 0 ? Math.round(patients / capacity * 100) : 0;
    var state = over > 0 ? 'crisis' : (patients >= capacity ? 'full' : (pct >= 70 ? 'busy' : 'ok'));
    return { zones: parts, patients: patients, capacity: capacity,
             over: over, waiting: waiting, state: state };
  }

  function unitCard(key, d) {
    if (!d) {
      return '<div class="unit"><div class="unit-hd"><div class="unit-name">' +
        esc(t('tabs.' + key + '.name')) + '</div></div>' +
        '<div class="skel">—</div></div>';
    }
    var f = unitFigures(d);
    var tot = f.patients || 1;
    var strip = f.zones.map(function (p) {
      return '<i class="z-' + p.zone + '" style="width:' + (p.total / tot * 100) + '%"></i>';
    }).join('');
    var keys = f.zones.map(function (p) {
      return '<span class="zkey"><span class="sw z-' + p.zone + '"></span>' +
        esc(t('zoneShort.' + p.zone) || p.zone.toUpperCase()) + ' <b>' + p.total + '</b></span>';
    }).join('');
    var badge = f.over > 0
      ? '<span class="state is-crisis">⚠ ' + f.over + ' ' + esc(t('public.crisisBeds')) + '</span>'
      : '<span class="state is-' + f.state + '">' + esc(t('public.state.' + f.state)) + '</span>';

    return '<a class="unit" href="/' + key + '">' +
      '<div class="unit-hd">' +
        '<div class="unit-name">' + esc(t('tabs.' + key + '.name')) +
          '<div class="unit-sub">' + esc(t('tabs.' + key + '.sub')) + '</div></div>' +
        badge +
      '</div>' +
      '<div class="unit-nums"><span class="unit-big">' + f.patients + '</span>' +
        '<span class="unit-cap">/ ' + f.capacity + '<br>' + esc(t('public.beds')) + '</span></div>' +
      '<div class="zstrip">' + strip + '</div>' +
      '<div class="zkeys">' + keys + '</div>' +
      (f.waiting ? '<div class="unit-wait"><b>' + f.waiting + '</b><span>' +
          esc(t('landing.waitingHere')) + '</span></div>' : '') +
      '<div class="unit-go">' + esc(t('landing.viewBoard')) + ' →</div>' +
    '</a>';
  }

  var lastData = null;

  function paint(res) {
    lastData = res;
    var host = $('units');
    if (!res || !res.ok || !res.units) {
      host.innerHTML = '<div class="offline">' + esc(t('landing.offline')) + '</div>';
      $('stampLabel').textContent = t('errTitle');
      $('stampTime').textContent = '';
      $('stamp').classList.add('is-stale');
      return;
    }
    host.innerHTML = UNITS.map(function (k) { return unitCard(k, res.units[k]); }).join('');
    var any = res.units.wcc || res.units.bu || res.units.pac;
    $('stamp').classList.remove('is-stale');
    $('stampLabel').textContent = (any && any.isSnapshot) ? t('snapshot') : t('updated');
    $('stampTime').textContent = (any && any.refTime) || res.generatedAt || '';
    $('demoChip').hidden = false;
  }

  function load() {
    fetch('/api/status', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        paint(res);
        try { localStorage.setItem('edpac_landing', JSON.stringify({ at: Date.now(), res: res })); } catch (e) {}
      })
      .catch(function () { if (!lastData) paint(null); });
  }

  // Last-known figures first, so the page is never a row of dashes while the
  // request is in flight; discarded beyond two hours.
  try {
    var snap = JSON.parse(localStorage.getItem('edpac_landing') || 'null');
    if (snap && snap.res && Date.now() - snap.at < 2 * 60 * 60 * 1000) paint(snap.res);
  } catch (e) {}

  applyStrings();
  load();
  setInterval(load, REFRESH_MS);

  window.EDPAC_LANDING = {
    reload: load, lang: function () { return lang; },
    figures: function (k) { return lastData && lastData.units && unitFigures(lastData.units[k]); }
  };
})();
</script>
</body>
</html>
